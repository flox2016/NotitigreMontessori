<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NotitigreMontessori - Admin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1e3c72;
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .hidden { display: none !important; }

  /* Login */
  .login {
    min-height: calc(100vh - 40px);
    display: flex; align-items: center; justify-content: center;
  }
  .login-box {
    background: white; padding: 30px; border-radius: 15px;
    width: 100%; max-width: 360px; text-align: center;
  }
  .login-box h2 { color: #1e3c72; margin-bottom: 18px; }
  .login-box input { width: 100%; padding: 12px; font-size: 18px; border: 2px solid #1e3c72; border-radius: 8px; text-align: center; }
  .login-box button { margin-top: 14px; width: 100%; padding: 12px; font-size: 16px; background: #1e3c72; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .login-error { color: #d33; margin-top: 10px; font-size: 14px; min-height: 18px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
  .header h1 { color: white; font-size: 26px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
  .header img { width: 70px; height: 70px; object-fit: contain; border-radius: 50%; background: white; padding: 4px; }

  /* Columnas */
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .panel { background: white; border-radius: 12px; padding: 20px; }
  .panel h2 { color: #1e3c72; border-bottom: 2px solid #1e3c72; padding-bottom: 8px; margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; color: #1e3c72; }
  .field input[type=text], .field textarea {
    width: 100%; padding: 10px; border: 1px solid #bbb; border-radius: 6px; font-size: 15px; font-family: inherit;
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .field input[type=file] { font-size: 14px; }
  .hint { font-size: 12px; color: #777; margin-top: 3px; }
  .btn {
    width: 100%; padding: 12px; font-size: 16px; background: #1e3c72; color: white;
    border: none; border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  .btn:disabled { background: #999; cursor: not-allowed; }
  .status { font-size: 14px; margin-top: 10px; min-height: 18px; }
  .status.ok { color: #1a7f37; }
  .status.err { color: #d33; }

  /* Lista */
  .list-wrap { background: white; border-radius: 12px; padding: 20px; margin-top: 20px; }
  .list-wrap h2 { color: #1e3c72; margin-bottom: 14px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; }
  .item img.thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; background: #eee; }
  .item .info { flex: 1; min-width: 0; }
  .item .info strong { color: #1e3c72; display: block; }
  .item .info span { font-size: 13px; color: #666; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; color: white; margin-left: 6px; }
  .tag.video { background: #e67e22; }
  .tag.diario { background: #27ae60; }
  .del { background: #ff6b6b; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
  .empty { color: #888; text-align: center; padding: 20px; }

  @media (max-width: 800px) {
    .columns { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">
  <div class="login-box">
    <h2>Ingresar</h2>
    <input type="password" id="passInput" placeholder="Contraseña" inputmode="numeric">
    <button id="loginBtn">Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- PANEL -->
<div id="adminScreen" class="hidden">
  <div class="header">
    <h1>NotitigreMontessori · Admin</h1>
    <img src="https://flkjwpcypihdkiyblucs.supabase.co/storage/v1/object/public/logos/notitigre-logo.png" alt="Logo" onerror="this.style.display='none'">
  </div>

  <div class="columns">
    <!-- Subir Video -->
    <div class="panel">
      <h2>Subir Video</h2>
      <div class="field">
        <label>Logo del video</label>
        <input type="file" id="vLogo" accept="image/*">
      </div>
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="vTitulo" placeholder="Nombre del video">
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea id="vDesc" placeholder="Descripción"></textarea>
      </div>
      <div class="field">
        <label>Archivo de video</label>
        <input type="file" id="vFile" accept="video/*">
      </div>
      <button class="btn" id="vBtn">Agregar Video</button>
      <div class="status" id="vStatus"></div>
    </div>

    <!-- Subir Diario -->
    <div class="panel">
      <h2>Subir Diario</h2>
      <div class="field">
        <label>Logo del diario</label>
        <input type="file" id="dLogo" accept="image/*">
      </div>
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="dTitulo" placeholder="Nombre del diario">
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea id="dDesc" placeholder="Descripción"></textarea>
      </div>
      <div class="field">
        <label>Imágenes (máximo 5)</label>
        <input type="file" id="dFiles" accept="image/*" multiple>
        <div class="hint">Podés elegir hasta 5 imágenes.</div>
      </div>
      <button class="btn" id="dBtn">Agregar Diario</button>
      <div class="status" id="dStatus"></div>
    </div>
  </div>

  <div class="list-wrap">
    <h2>Todos los diarios y videos</h2>
    <div id="lista"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://flkjwpcypihdkiyblucs.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsa2p3cGN5cGloZGtpeWJsdWNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMDM2MjMsImV4cCI6MjA5ODY3OTYyM30.Zevico24gkdO9-d8xOWKFSRsKt_npHef4F2OFCR5DsU';
const PASSWORD = '11011';
const MAX_IMAGENES = 5;
const HDRS = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };

// ---------- Login ----------
function entrar() {
  if (document.getElementById('passInput').value === PASSWORD) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminScreen').classList.remove('hidden');
    cargarLista();
  } else {
    document.getElementById('loginError').textContent = 'Contraseña incorrecta';
  }
}
document.getElementById('loginBtn').addEventListener('click', entrar);
document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

// ---------- Helpers ----------
function setStatus(id, msg, tipo) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status ' + (tipo || '');
}

function nombreSeguro(nombre) {
  const limpio = nombre.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9._-]/g, '_');
  return `${Date.now()}_${Math.random().toString(36).slice(2, 7)}_${limpio}`;
}

async function subirArchivo(bucket, file) {
  const path = nombreSeguro(file.name);
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`, {
    method: 'POST',
    headers: { ...HDRS, 'Content-Type': file.type || 'application/octet-stream', 'x-upsert': 'false' },
    body: file
  });
  if (!res.ok) throw new Error(`Storage ${bucket}: HTTP ${res.status}`);
  return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`;
}

async function insertarFila(fila) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/contenido`, {
    method: 'POST',
    headers: { ...HDRS, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify(fila)
  });
  if (!res.ok) throw new Error('Tabla contenido: HTTP ' + res.status);
}

// ---------- Subir Video ----------
document.getElementById('vBtn').addEventListener('click', async () => {
  const titulo = document.getElementById('vTitulo').value.trim();
  const desc = document.getElementById('vDesc').value.trim();
  const logo = document.getElementById('vLogo').files[0];
  const video = document.getElementById('vFile').files[0];
  const btn = document.getElementById('vBtn');

  if (!titulo || !video) return setStatus('vStatus', 'Falta nombre o archivo de video', 'err');

  btn.disabled = true;
  try {
    setStatus('vStatus', 'Subiendo video...');
    const urlVideo = await subirArchivo('videos', video);
    const urlLogo = logo ? await subirArchivo('logos', logo) : null;
    await insertarFila({ titulo, descripcion: desc, tipo: 'video', url_archivo: urlVideo, logo_url: urlLogo, imagenes: [], estado: 'publicado' });
    setStatus('vStatus', 'Video agregado ✓', 'ok');
    ['vTitulo','vDesc'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('vLogo').value = '';
    document.getElementById('vFile').value = '';
    cargarLista();
  } catch (err) {
    console.error(err);
    setStatus('vStatus', 'Error: ' + err.message, 'err');
  } finally {
    btn.disabled = false;
  }
});

// ---------- Subir Diario ----------
document.getElementById('dBtn').addEventListener('click', async () => {
  const titulo = document.getElementById('dTitulo').value.trim();
  const desc = document.getElementById('dDesc').value.trim();
  const logo = document.getElementById('dLogo').files[0];
  const files = Array.from(document.getElementById('dFiles').files);
  const btn = document.getElementById('dBtn');

  if (!titulo || !files.length) return setStatus('dStatus', 'Falta nombre o imágenes', 'err');
  if (files.length > MAX_IMAGENES) return setStatus('dStatus', `Máximo ${MAX_IMAGENES} imágenes`, 'err');

  btn.disabled = true;
  try {
    setStatus('dStatus', 'Subiendo diario...');
    const urlsImg = [];
    for (const f of files) urlsImg.push(await subirArchivo('imagenes', f));
    const urlLogo = logo ? await subirArchivo('logos', logo) : null;
    await insertarFila({ titulo, descripcion: desc, tipo: 'diario', url_archivo: null, logo_url: urlLogo, imagenes: urlsImg, estado: 'publicado' });
    setStatus('dStatus', 'Diario agregado ✓', 'ok');
    ['dTitulo','dDesc'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('dLogo').value = '';
    document.getElementById('dFiles').value = '';
    cargarLista();
  } catch (err) {
    console.error(err);
    setStatus('dStatus', 'Error: ' + err.message, 'err');
  } finally {
    btn.disabled = false;
  }
});

// ---------- Lista ----------
async function cargarLista() {
  const cont = document.getElementById('lista');
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/contenido?select=*&order=creado_en.desc`, { headers: HDRS });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const items = await res.json();
    if (!items.length) { cont.innerHTML = '<div class="empty">Todavía no hay contenido</div>'; return; }
    cont.innerHTML = items.map(it => `
      <div class="item">
        <img class="thumb" src="${it.logo_url || (it.imagenes && it.imagenes[0]) || ''}" alt="" onerror="this.style.visibility='hidden'">
        <div class="info">
          <strong>${escapar(it.titulo)}<span class="tag ${it.tipo}">${it.tipo}</span></strong>
          <span>${escapar(it.descripcion || '')}</span>
        </div>
        <button class="del" data-id="${it.id}">Borrar</button>
      </div>`).join('');
  } catch (err) {
    cont.innerHTML = '<div class="empty">No se pudo cargar la lista</div>';
    console.error(err);
  }
}

function escapar(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('lista').addEventListener('click', async e => {
  const btn = e.target.closest('.del');
  if (!btn) return;
  if (!confirm('¿Borrar este contenido?')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/contenido?id=eq.${btn.dataset.id}`, {
      method: 'DELETE', headers: HDRS
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    cargarLista();
  } catch (err) {
    alert('No se pudo borrar: ' + err.message);
  }
});
</script>
</body>
</html>
