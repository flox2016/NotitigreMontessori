    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4a5fd9;
            --secondary: #6b7ce8;
            --bg: #0f1419;
            --surface: #1a1f2e;
            --text: #e0e0e0;
            --accent: #ff6b35;
            --success: #4caf50;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--surface);
        }

        .logo {
            width: 50px;
            height: 50px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }

        h1 {
            font-size: 28px;
            color: var(--text);
        }

        .panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--surface);
            border: 1px solid rgba(107, 124, 232, 0.2);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(74, 93, 217, 0.1);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: var(--text);
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="url"],
        input[type="file"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(107, 124, 232, 0.3);
            border-radius: 6px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="url"]:focus,
        input[type="file"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 93, 217, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .preview-area {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            display: none;
        }

        .preview-area.active {
            display: block;
        }

        .preview-area img,
        .preview-area video {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 93, 217, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: #f44336;
            color: white;
            padding: 8px 16px;
            width: auto;
        }

        .btn-danger:hover {
            background: #d32f2f;
        }

        .contenido-list {
            margin-top: 30px;
        }

        .contenido-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(107, 124, 232, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .contenido-info {
            flex: 1;
        }

        .contenido-titulo {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .contenido-tipo {
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .contenido-estado {
            font-size: 12px;
            padding: 4px 8px;
            background: rgba(76, 175, 80, 0.2);
            color: var(--success);
            border-radius: 4px;
            width: fit-content;
        }

        .contenido-actions {
            display: flex;
            gap: 8px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(224, 224, 224, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .alert.active {
            display: block;
        }

        .alert-success {
            background: rgba(76, 175, 80, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .alert-error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }

        @media (max-width: 768px) {
            .panel {
                grid-template-columns: 1fr;
            }

            .contenido-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .contenido-actions {
                width: 100%;
                margin-top: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">NT</div>
            <h1>NotitigreMontessori Admin</h1>
            <p style="color: var(--accent); font-size: 12px; margin-left: auto;">Las Noticias Llegan Aca</p>
        </header>

        <div class="panel">
            <!-- Subir Video -->
            <div class="card">
                <h2>📹 Subir Video</h2>
                <div id="alertVideo" class="alert"></div>

                <div class="form-group">
                    <label>Título del video</label>
                    <input type="text" id="videoTitle" placeholder="Ej: Clase de matemáticas">
                </div>

                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="videoDesc" placeholder="Describe el contenido del video"></textarea>
                </div>

                <div class="form-group">
                    <label>URL del Video (MP4 o YouTube)</label>
                    <input type="url" id="videoUrl" placeholder="https://ejemplo.com/video.mp4">
                </div>

                <div class="form-group">
                    <label>URL del Logo</label>
                    <input type="url" id="videoLogo" placeholder="https://ejemplo.com/logo.png" value="https://flkjwpcypihdkiyblucs.supabase.co/storage/v1/object/public/logos/notitigre-logo.png">
                </div>

                <div class="form-group">
                    <button class="btn btn-primary" id="btnUploadVideo">
                        <span id="videoSpinner" class="spinner" style="display:none; margin-right: 8px;"></span>
                        Subir Video
                    </button>
                </div>

                <div id="videoPreview" class="preview-area">
                    <video id="previewVideo" controls style="width:100%;"></video>
                </div>
            </div>

            <!-- Subir Diario -->
            <div class="card">
                <h2>📷 Subir Diario</h2>
                <div id="alertDiary" class="alert"></div>

                <div class="form-group">
                    <label>Título del diario</label>
                    <input type="text" id="diaryTitle" placeholder="Ej: Diario Lunes 15">
                </div>

                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="diaryDesc" placeholder="Describe el contenido del diario"></textarea>
                </div>

                <div class="form-group">
                    <label>Imágenes del Diario (JSON o URLs)</label>
                    <textarea id="diaryImages" placeholder='["https://ejemplo.com/img1.jpg", "https://ejemplo.com/img2.jpg"]'></textarea>
                </div>

                <div class="form-group">
                    <label>URL del Logo</label>
                    <input type="url" id="diaryLogo" placeholder="https://ejemplo.com/logo.png" value="https://flkjwpcypihdkiyblucs.supabase.co/storage/v1/object/public/logos/notitigre-logo.png">
                </div>

                <div class="form-group">
                    <button class="btn btn-primary" id="btnUploadDiary">
                        <span id="diarySpinner" class="spinner" style="display:none; margin-right: 8px;"></span>
                        Subir Diario
                    </button>
                </div>

                <div id="diaryPreview" class="preview-area">
                    <div id="previewImages" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px;"></div>
                </div>
            </div>
        </div>

        <!-- Contenido Publicado -->
        <div class="card">
            <h2>📋 Contenido Publicado</h2>
            <div id="contenidoList" class="contenido-list">
                <p style="color: var(--text); text-align: center; padding: 20px;">Cargando contenido...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://flkjwpcypihdkiyblucs.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsa2p3cGN5cGloZGtpeWJsdWNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMDM2MjMsImV4cCI6MjA5ODY3OTYyM30.Zevico24gkdO9-d8xOWKFSRsKt_npHef4F2OFCR5DsU';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Refs
        const videoTitle = document.getElementById('videoTitle');
        const videoDesc = document.getElementById('videoDesc');
        const videoUrl = document.getElementById('videoUrl');
        const videoLogo = document.getElementById('videoLogo');
        const btnUploadVideo = document.getElementById('btnUploadVideo');

        const diaryTitle = document.getElementById('diaryTitle');
        const diaryDesc = document.getElementById('diaryDesc');
        const diaryImages = document.getElementById('diaryImages');
        const diaryLogo = document.getElementById('diaryLogo');
        const btnUploadDiary = document.getElementById('btnUploadDiary');

        const alertVideo = document.getElementById('alertVideo');
        const alertDiary = document.getElementById('alertDiary');

        // Event Listeners
        btnUploadVideo.addEventListener('click', uploadVideo);
        btnUploadDiary.addEventListener('click', uploadDiary);
        videoUrl.addEventListener('change', previewVideo);
        diaryImages.addEventListener('change', previewDiaryImages);

        async function uploadVideo() {
            const title = videoTitle.value.trim();
            const desc = videoDesc.value.trim();
            const url = videoUrl.value.trim();
            const logo = videoLogo.value.trim();

            if (!title || !desc || !url || !logo) {
                showAlert(alertVideo, 'error', 'Completa todos los campos');
                return;
            }

            showAlert(alertVideo, 'info', 'Subiendo...');
            btnUploadVideo.disabled = true;
            document.getElementById('videoSpinner').style.display = 'inline-block';

            try {
                const { data, error } = await supabase
                    .from('contenido')
                    .insert([{
                        titulo: title,
                        descripcion: desc,
                        tipo: 'video',
                        url_archivo: url,
                        logo_url: logo,
                        imagenes: null,
                        estado: 'publicado',
                        creado_en: new Date().toISOString()
                    }])
                    .select();

                if (error) throw error;

                showAlert(alertVideo, 'success', '✓ Video subido correctamente');
                videoTitle.value = '';
                videoDesc.value = '';
                videoUrl.value = '';
                loadContenido();

                setTimeout(() => alertVideo.classList.remove('active'), 3000);
            } catch (err) {
                showAlert(alertVideo, 'error', 'Error: ' + err.message);
            } finally {
                btnUploadVideo.disabled = false;
                document.getElementById('videoSpinner').style.display = 'none';
            }
        }

        async function uploadDiary() {
            const title = diaryTitle.value.trim();
            const desc = diaryDesc.value.trim();
            const imagesStr = diaryImages.value.trim();
            const logo = diaryLogo.value.trim();

            if (!title || !desc || !imagesStr || !logo) {
                showAlert(alertDiary, 'error', 'Completa todos los campos');
                return;
            }

            let images;
            try {
                images = JSON.parse(imagesStr);
                if (!Array.isArray(images)) throw new Error('Debe ser un array');
            } catch (err) {
                showAlert(alertDiary, 'error', 'Las imágenes deben ser un JSON válido');
                return;
            }

            showAlert(alertDiary, 'info', 'Subiendo...');
            btnUploadDiary.disabled = true;
            document.getElementById('diarySpinner').style.display = 'inline-block';

            try {
                const { data, error } = await supabase
                    .from('contenido')
                    .insert([{
                        titulo: title,
                        descripcion: desc,
                        tipo: 'diario',
                        url_archivo: images[0] || '',
                        logo_url: logo,
                        imagenes: images,
                        estado: 'publicado',
                        creado_en: new Date().toISOString()
                    }])
                    .select();

                if (error) throw error;

                showAlert(alertDiary, 'success', '✓ Diario subido correctamente');
                diaryTitle.value = '';
                diaryDesc.value = '';
                diaryImages.value = '';
                loadContenido();

                setTimeout(() => alertDiary.classList.remove('active'), 3000);
            } catch (err) {
                showAlert(alertDiary, 'error', 'Error: ' + err.message);
            } finally {
                btnUploadDiary.disabled = false;
                document.getElementById('diarySpinner').style.display = 'none';
            }
        }

        function previewVideo() {
            const url = videoUrl.value.trim();
            const preview = document.getElementById('videoPreview');
            const previewVideo = document.getElementById('previewVideo');

            if (url) {
                previewVideo.src = url;
                preview.classList.add('active');
            } else {
                preview.classList.remove('active');
            }
        }

        function previewDiaryImages() {
            const imagesStr = diaryImages.value.trim();
            const preview = document.getElementById('diaryPreview');
            const previewImages = document.getElementById('previewImages');

            if (!imagesStr) {
                preview.classList.remove('active');
                return;
            }

            try {
                const images = JSON.parse(imagesStr);
                previewImages.innerHTML = images.map(img => 
                    `<img src="${img}" alt="preview" style="width:100%; height:80px; object-fit:cover; border-radius:4px;">`
                ).join('');
                preview.classList.add('active');
            } catch (err) {
                preview.classList.remove('active');
            }
        }

        async function loadContenido() {
            try {
                const { data, error } = await supabase
                    .from('contenido')
                    .select('*')
                    .eq('estado', 'publicado')
                    .order('creado_en', { ascending: false });

                if (error) throw error;

                const list = document.getElementById('contenidoList');

                if (!data || data.length === 0) {
                    list.innerHTML = '<p style="color: var(--text); text-align: center; padding: 20px;">No hay contenido publicado</p>';
                    return;
                }

                list.innerHTML = data.map(item => `
                    <div class="contenido-item">
                        <div class="contenido-info">
                            <div class="contenido-titulo">${item.titulo}</div>
                            <div class="contenido-tipo">${item.tipo === 'video' ? '📹 Video' : '📷 Diario'}</div>
                            <div class="contenido-estado">Publicado</div>
                        </div>
                        <div class="contenido-actions">
                            <button class="btn btn-danger" onclick="deleteContenido('${item.id}')">Eliminar</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error loading contenido:', err);
            }
        }

        async function deleteContenido(id) {
            if (!confirm('¿Eliminar este contenido?')) return;

            try {
                const { error } = await supabase
                    .from('contenido')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                loadContenido();
            } catch (err) {
                alert('Error al eliminar: ' + err.message);
            }
        }

        function showAlert(element, type, message) {
            element.className = `alert active alert-${type}`;
            element.textContent = message;
        }

        // Cargar contenido al inicio
        loadContenido();
        setInterval(loadContenido, 5000);
    </script>
</body>
</html>
